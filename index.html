<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome ItzFizz | Scroll Hero</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <style>
    body { background: #0b0b0f; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .will-anim { will-change: transform, opacity; }
    .road { background: repeating-linear-gradient(90deg, #3a3a46 0 40px, transparent 40px 80px); }
    .letter, .stat-num, .stat-label { opacity: 0; }   
    .letter { color: #fff; }
    
    :root { --car-w: 140px; --car-ratio: 0.499; }
    @media (min-width: 640px)  { :root { --car-w: 220px; } }
    @media (min-width: 1024px) { :root { --car-w: 300px; } }
    #hero { padding-bottom: calc(8vh + var(--car-w) * var(--car-ratio) + 28px); }
   
    #car { position: relative; width: var(--car-w); aspect-ratio: 557 / 278; }
    #car svg, #car img { position: absolute; inset: 0; width: 100%; height: 100%; }
    #car svg { overflow: visible; }
    #car img { display: block; user-select: none; }
    #carMove { position: relative; z-index: 1; width: calc(100% - var(--car-w)); }
    #road { position: absolute; left: 0; right: 0; top: 50%; height: 3px; margin-top: -1.5px; }
    .trail { position: absolute; top: 0; bottom: 0; background: #10b981; opacity: .85; }
    #trailStart { left: 0; width: calc(var(--car-w) / 2); }
    #trailGrow { left: calc(var(--car-w) / 2); width: calc(100% - var(--car-w)); transform-origin: left center; transform: scaleX(0); }
  </style>
</head>

<body class="text-white antialiased">

  <section id="hero" class="relative h-screen overflow-hidden flex flex-col items-center justify-center px-6">
    <div class="absolute inset-0 bg-gradient-to-b from-[#14141c] via-[#0b0b0f] to-[#050507]"></div>

    <h1 id="headline"
        class="relative z-10 flex flex-wrap justify-center gap-x-[0.6em] gap-y-2 text-2xl sm:text-4xl lg:text-6xl font-light tracking-[0.3em] sm:tracking-[0.5em]"
        aria-label="Welcome ItzFizz"></h1>

    <div id="stats" class="relative z-10 mt-8 sm:mt-12 grid grid-cols-2 md:grid-cols-4 gap-6 sm:gap-8 text-center max-w-4xl">
      <div class="stat will-anim"><div class="stat-inner will-anim"><p class="stat-num will-anim text-3xl sm:text-5xl font-semibold text-amber-400">98%</p><p class="stat-label will-anim mt-1 text-xs sm:text-sm text-zinc-400">Retention</p></div></div>
      <div class="stat will-anim"><div class="stat-inner will-anim"><p class="stat-num will-anim text-3xl sm:text-5xl font-semibold text-amber-400">3x</p><p class="stat-label will-anim mt-1 text-xs sm:text-sm text-zinc-400">Growth</p></div></div>
      <div class="stat will-anim"><div class="stat-inner will-anim"><p class="stat-num will-anim text-3xl sm:text-5xl font-semibold text-amber-400">45%</p><p class="stat-label will-anim mt-1 text-xs sm:text-sm text-zinc-400">Efficiency</p></div></div>
      <div class="stat will-anim"><div class="stat-inner will-anim"><p class="stat-num will-anim text-3xl sm:text-5xl font-semibold text-amber-400">120+</p><p class="stat-label will-anim mt-1 text-xs sm:text-sm text-zinc-400">Projects</p></div></div>
    </div>

    <div id="carWrap" class="absolute bottom-[8vh] inset-x-[6vw] z-10 will-anim">
      <div id="track" class="relative">
        <div id="carMove" class="will-anim"><div id="car">
          <svg viewBox="0 0 557 278" fill="none" aria-hidden="true">
            <defs><clipPath id="tyreClip"><rect width="64" height="26" rx="7"/></clipPath></defs>
            <g transform="translate(83.0 -6.0) scale(1.3125)"><g clip-path="url(#tyreClip)"><rect width="64" height="26" fill="#27272a"/><g class="tread"></g><rect width="64" height="26" rx="7" fill="none" stroke="#a1a1aa" stroke-width="2"/></g></g><g transform="translate(83.0 249.0) scale(1.3125)"><g clip-path="url(#tyreClip)"><rect width="64" height="26" fill="#27272a"/><g class="tread"></g><rect width="64" height="26" rx="7" fill="none" stroke="#a1a1aa" stroke-width="2"/></g></g><g transform="translate(395.0 1.0) scale(1.3125)"><g clip-path="url(#tyreClip)"><rect width="64" height="26" fill="#27272a"/><g class="tread"></g><rect width="64" height="26" rx="7" fill="none" stroke="#a1a1aa" stroke-width="2"/></g></g><g transform="translate(395.0 245.0) scale(1.3125)"><g clip-path="url(#tyreClip)"><rect width="64" height="26" fill="#27272a"/><g class="tread"></g><rect width="64" height="26" rx="7" fill="none" stroke="#a1a1aa" stroke-width="2"/></g></g>
          </svg>
          <img src="assets/car.png" alt="" draggable="false" />
        </div></div>
        <div id="road">
          <div class="road absolute inset-0 opacity-60"></div>
          <div id="trailStart" class="trail"></div>
          <div id="trailGrow" class="trail will-anim"></div>
        </div>
      </div>
    </div>
  </section>

  <script>
    gsap.registerPlugin(ScrollTrigger);
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

    const headline = document.getElementById("headline");
    "WELCOME ITZ FIZZ".split(" ").forEach((word) => {
      const w = document.createElement("span");
      w.className = "inline-block whitespace-nowrap";
      [...word].forEach((ch) => {
        const s = document.createElement("span");
        s.className = "letter inline-block will-anim";
        s.textContent = ch;
        w.appendChild(s);
      });
      headline.appendChild(w);
    });

    const letters = gsap.utils.toArray(".letter");
    const car = document.getElementById("car");
    const track = document.getElementById("track");

    document.querySelectorAll(".tread").forEach((g) => {
      for (let x = -32; x <= 64; x += 8) {
        const i = x / 8, mod = (n) => ((i % n) + n) % n;
        const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        r.setAttribute("x", x); r.setAttribute("width", 4); r.setAttribute("height", 26);
        r.setAttribute("fill", mod(4) === 0 ? "#fbbf24" : mod(2) === 0 ? "#e4e4e7" : "#71717a");
        g.appendChild(r);
      }
    });

    if (reduceMotion) {
      gsap.set([letters, ".stat-num", ".stat-label"], { opacity: 1 });   
    } else {
gsap.from("#carWrap", { y: 24, opacity: 0, duration: 1, ease: "power3.out" });

      const treadTravel = () => {
        const cw = car.getBoundingClientRect().width;
        return ((track.clientWidth - cw) * 557) / cw / 1.3125;   
      };

      const tl = gsap.timeline({
        defaults: { ease: "none" },                              
        scrollTrigger: {
          trigger: "#hero",
          start: "top top",
          end: () => "+=" + innerHeight * (innerWidth < 768 ? 1.2 : 1.8),
          pin: true,
          scrub: 1,                                        
          anticipatePin: 1,
          invalidateOnRefresh: true,
        },
      });

      tl.fromTo("#carMove", { xPercent: 0 }, { xPercent: 100, duration: 1 }, 0)   
        .fromTo("#trailGrow", { scaleX: 0 }, { scaleX: 1, duration: 1 }, 0)       
        .to(".tread", { x: treadTravel, duration: 1, modifiers: { x: (v) => ((parseFloat(v) % 32) + 32) % 32 } }, 0);
      const words  = [...headline.children].map((w) => w.querySelectorAll(".letter"));
      const nums   = gsap.utils.toArray(".stat-num");
      const labels = gsap.utils.toArray(".stat-label");

      const showWord = (i, at, spread) =>
        tl.fromTo(words[i], { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.06, stagger: { amount: spread } }, at);

      const showStat = (i, at) =>                     
        tl.fromTo(nums[i], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.07 }, at)
          .fromTo(labels[i], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.07 }, at + 0.03);

      showWord(0, 0.04, 0.14);   
      showStat(0, 0.26);         
      showStat(1, 0.34);         
      showWord(1, 0.46, 0.06);   
      showStat(2, 0.60);         
      showWord(2, 0.72, 0.08);   
      showStat(3, 0.88);         

      addEventListener("load", () => ScrollTrigger.refresh());
    }
  </script>
</body>
</html>
